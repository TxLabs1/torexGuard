name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ──────────────────────────────────────────────────────────────
  # PHP / Laravel: lint, static analysis, feature & unit tests
  # ──────────────────────────────────────────────────────────────
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4"]

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: torexguard_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: torexguard_test
      DB_USERNAME: root
      DB_PASSWORD: root
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      BROADCAST_CONNECTION: log
      MAIL_MAILER: array

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, pdo, pdo_mysql, redis, bcmath, zip, gd, opcache
          coverage: none
          tools: composer:v2

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-${{ matrix.php }}-

      - name: Install composer deps
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Copy .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pint (code style)
        run: vendor/bin/pint --test

      - name: Larastan (static analysis)
        if: ${{ hashFiles('phpstan.neon', 'phpstan.neon.dist') != '' }}
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Migrate test DB
        run: php artisan migrate --force

      - name: PHPUnit / Pest
        run: php artisan test --parallel --processes=2

  # ──────────────────────────────────────────────────────────────
  # Go agent: vet, test, build matrix
  # ──────────────────────────────────────────────────────────────
  go:
    name: Go agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"

      - name: Download module dependencies
        run: go mod download

      - name: Verify go.mod / go.sum are committed cleanly
        run: |
          go mod tidy -e
          if ! git diff --quiet -- go.mod go.sum; then
            echo "::error::go.mod or go.sum is out of date. Run 'go mod tidy' locally for every release target (linux, darwin, windows) and commit the result."
            git diff -- go.mod go.sum
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -race -count=1

      - name: Build matrix
        run: |
          set -eux
          mkdir -p ../dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%%/*}"
            arch="${target##*/}"
            ext=""
            [ "$os" = "windows" ] && ext=".exe"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 \
              go build -trimpath -ldflags="-s -w" \
              -o "../dist/torex-agent-${os}-${arch}${ext}" ./cmd
          done

      - uses: actions/upload-artifact@v4
        with:
          name: torex-agent-binaries
          path: dist/

  # ──────────────────────────────────────────────────────────────
  # Docker: ensure prod image builds (fast sanity, no push)
  # ──────────────────────────────────────────────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: production
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
